<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img">
  <title>A2UI flow</title>
  <desc>Model to catalog check to your components; your server sends facts to the model and real data straight to the components.</desc>
  <defs>
    <marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#FFFFFF"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#8A93A6"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#FF7A33"/></marker>
  </defs>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; }
    .label { font-size: 44px; fill: #FFFFFF; }
    .small { font-size: 34px; }
  </style>
  <rect width="1080" height="1350" fill="#0F1623"/>

  <rect x="120" y="335" width="420" height="120" rx="16" fill="#0F1623" stroke="#8A93A6" stroke-width="3" stroke-dasharray="14 10"/>
  <text class="label" x="330" y="395" text-anchor="middle" dominant-baseline="central">Model</text>

  <rect x="120" y="615" width="420" height="120" rx="16" fill="#0F1623" stroke="#FFFFFF" stroke-width="3"/>
  <text class="label" x="330" y="675" text-anchor="middle" dominant-baseline="central">Catalog check</text>

  <rect x="120" y="895" width="420" height="120" rx="16" fill="#0F1623" stroke="#FFFFFF" stroke-width="3"/>
  <text class="label" x="330" y="955" text-anchor="middle" dominant-baseline="central">Your components</text>

  <rect x="640" y="615" width="320" height="120" rx="16" fill="#0F1623" stroke="#FFFFFF" stroke-width="3"/>
  <text class="label" x="800" y="675" text-anchor="middle" dominant-baseline="central">Your server</text>

  <line x1="330" y1="463" x2="330" y2="603" stroke="#FFFFFF" stroke-width="4" marker-end="url(#w)"/>
  <line x1="330" y1="743" x2="330" y2="883" stroke="#FFFFFF" stroke-width="4" marker-end="url(#w)"/>

  <path d="M800 607 L800 395 L552 395" fill="none" stroke="#8A93A6" stroke-width="4" marker-end="url(#g)"/>
  <text class="small" x="676" y="365" text-anchor="middle" fill="#8A93A6">Facts</text>

  <path d="M800 743 L800 955 L552 955" fill="none" stroke="#FF7A33" stroke-width="6" marker-end="url(#o)"/>
  <text class="small" x="676" y="925" text-anchor="middle" fill="#FF7A33">Real data</text>
</svg>
